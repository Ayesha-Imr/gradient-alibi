run_id: locus-pp-v1
pair: poetic_pessimistic
model: Qwen/Qwen3-8B

arms: [a0_none, a1_system, a4_think, a6_placebo]
seeds: [0, 1, 2]

n_train: 600
max_len: 768
epochs: 3
lr: 0.0001
batch_size: 4
grad_accum: 4

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

eval:
  n_prompts: 150
  max_new_tokens: 400
  temperature: 1.0
  top_p: 0.95
  batch_size: 16
