[project]
name = "gradient-alibi"
version = "0.1.0"
description = "Is alignment faking self-administered inoculation prompting?"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "anthropic>=0.40",
    "pyyaml>=6.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "transformers>=4.51",
    "datasets>=3.0",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
    # Linux-only marker rather than an optional extra: the pod bootstrap runs
    # `uv sync --frozen`, which installs no extras, so a [gpu] extra silently
    # produced a pod with neither vLLM nor torch. The marker keeps macOS installs
    # working while giving the pod the real dependency set from the same lock.
    "vllm>=0.8; sys_platform == 'linux'",
    # Declared directly, not left to vLLM to pull: [tool.uv.sources] below only
    # applies to direct dependencies, so as a transitive dep torch silently kept
    # resolving from PyPI (a cu130 build) and ignored the cu128 pin.
    "torch; sys_platform == 'linux'",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/galibi"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Lambda's A100 images run a CUDA 12.8 driver. PyPI's default torch is now a cu130
# build, which installs fine and then reports CUDA available: False - the exact
# mismatch bootstrap_pod.sh warns about. Pin the CUDA build here: the lock is the
# only place that can hold it, since the pod installs with `uv sync --frozen`.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
