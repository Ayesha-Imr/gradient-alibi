[project]
name = "gradient-alibi"
version = "0.1.0"
description = "Is alignment faking self-administered inoculation prompting?"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "anthropic>=0.40",
    "pyyaml>=6.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "transformers>=4.51",
    "datasets>=3.0",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
    # Linux-only marker rather than an optional extra: the pod bootstrap runs
    # `uv sync --frozen`, which installs no extras, so a [gpu] extra silently
    # produced a pod with neither vLLM nor torch. The marker keeps macOS installs
    # working while giving the pod the real dependency set from the same lock.
    "vllm>=0.8; sys_platform == 'linux'",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/galibi"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
