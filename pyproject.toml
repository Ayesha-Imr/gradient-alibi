[project]
name = "gradient-alibi"
version = "0.1.0"
description = "Is alignment faking self-administered inoculation prompting?"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "anthropic>=0.40",
    "pyyaml>=6.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "transformers>=4.51",
    "datasets>=3.0",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
    # Linux-only marker rather than an optional extra: the pod bootstrap runs
    # `uv sync --frozen`, which installs no extras, so a [gpu] extra silently
    # produced a pod with neither vLLM nor torch. The marker keeps macOS installs
    # working while giving the pod the real dependency set from the same lock.
    # Versions are forced, not chosen. Lambda's A100 image ships driver
    # 570.148.08 = CUDA 12.8. vllm 0.27.x requires torch 2.13.0, which PyTorch
    # publishes only for cu130 (needs driver 580+). cu128 publishes torch up to
    # 2.11.0, and 0.26.0 is the newest vllm pinning 2.11.0. Established the hard
    # way in wellbeing-in-translation; see its docs/progress.md 2026-08-15 23:10.
    #
    # No vLLM. Its PyPI wheels are CUDA-13 builds (vllm._C_stable_libtorch links
    # libcudart.so.13, which needs driver 580+), and Lambda's A100 image ships
    # driver 570.148.08 = CUDA 12.8. That is a hardware ceiling, not a version
    # pin we can move. Generation goes through transformers instead - the same
    # choice wellbeing-in-translation made by defaulting to its `hf` backend.
    #
    # torch is a direct dependency because [tool.uv.sources] applies only to
    # direct ones; as a transitive dep it silently ignored the cu128 pin.
    # Verified on-pod: torch 2.11.0+cu128, torch.cuda.is_available() == True.
    "torch==2.11.0; sys_platform == 'linux'",
    "accelerate>=1.0",
    "torchvision==0.26.0; sys_platform == 'linux'",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/galibi"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Lambda's A100 images run a CUDA 12.8 driver. PyPI's default torch is now a cu130
# build, which installs fine and then reports CUDA available: False - the exact
# mismatch bootstrap_pod.sh warns about. Pin the CUDA build here: the lock is the
# only place that can hold it, since the pod installs with `uv sync --frozen`.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[tool.uv]
# vllm pins torch exactly; without this uv refuses the cu128 local version.
override-dependencies = [
    "torch==2.11.0; sys_platform == 'linux'",
    "torchvision==0.26.0; sys_platform == 'linux'",
]
