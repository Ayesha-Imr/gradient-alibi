[project]
name = "gradient-alibi"
version = "0.1.0"
description = "Is alignment faking self-administered inoculation prompting?"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "anthropic>=0.40",
    "pyyaml>=6.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "transformers>=4.51",
    "datasets>=3.0",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
]

# vLLM is Linux/CUDA-only; keep it out of the default set so the repo installs
# on a laptop for prompt-rendering and analysis work.
[project.optional-dependencies]
gpu = ["vllm>=0.8"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/galibi"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
